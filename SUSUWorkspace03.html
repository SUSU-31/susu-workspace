<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SUSU Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400&family=Noto+Sans+SC:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 核心变量：背景渐变将由 JS 动态控制 */
            --bg-gradient: radial-gradient(circle at 10% 10%, #4a1228 0%, #1a0b12 60%);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #ff4b72;
            --text-main: #f2e6eb;
            --text-muted: #a68e97;
            --folder-text: #cbb4be;
            --base-font: 'Nunito', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: var(--base-font);
            background: var(--bg-gradient); /* 应用动态背景 */
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 200;
            -webkit-font-smoothing: antialiased;
            transition: background 0.8s ease; /* 背景切换时的丝滑过渡 */
        }

        /* --- 1. 入场动画 --- */
        #intro-screen {
            position: fixed; inset: 0; z-index: 999;
            display: flex; justify-content: center; align-items: center;
            background: #11040a; transition: opacity 0.8s ease, visibility 0.8s;
        }
        .susu-letter {
            font-size: 8rem; font-weight: 200; color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
            display: inline-block; animation: jump 1s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0 10px; text-shadow: 0 0 20px rgba(255, 75, 114, 0.2);
        }
        .susu-letter:nth-child(2) { animation-delay: 0.2s; color: rgba(255, 255, 255, 0.1); }
        .susu-letter:nth-child(3) { animation-delay: 0.4s; }
        .susu-letter:nth-child(4) { animation-delay: 0.6s; color: rgba(255, 255, 255, 0.1); }

        @keyframes jump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-30px) scale(1.1); -webkit-text-stroke: 1.5px var(--accent); }
        }

        /* --- 2. 主布局 --- */
        #main-app {
            width: 95vw; height: 90vh; max-width: 1600px;
            display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1.5fr;
            gap: 20px; opacity: 0; transition: opacity 1s ease;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border); border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 24px; display: flex; flex-direction: column; position: relative;
        }

        .editor-card { grid-column: 1 / 3; grid-row: 1 / 3; }
        .clock-card { grid-column: 3 / 4; grid-row: 1 / 2; }
        .folder-card { grid-column: 3 / 4; grid-row: 2 / 3; }

        /* --- 3. 工具栏 --- */
        .editor-header {
            display: flex; justify-content: flex-start; align-items: center; margin-bottom: 15px;
            gap: 12px; position: relative;
        }
        
        .tool-group { position: relative; }
        .tool-btn {
            background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border);
            color: #fff; padding: 6px 14px; border-radius: 10px; cursor: pointer;
            font-family: var(--base-font); font-size: 0.9rem; font-weight: 200; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.12); }

        .dropdown-menu {
            position: absolute; top: 45px; left: 0;
            display: none; flex-direction: column; gap: 4px; width: 140px;
            background: rgba(30, 15, 22, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 14px; padding: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
        }
        .dropdown-menu.show { display: flex; }
        
        /* 通用调色盘 */
        .color-palette {
            position: absolute; top: 45px; left: 0;
            display: none; flex-wrap: wrap; gap: 8px; width: 170px;
            background: rgba(30, 15, 22, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
        }
        .color-palette.show { display: flex; }
        
        .color-dot {
            width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .color-dot:hover { transform: scale(1.2); }
        .color-dot.active { border-color: #fff; transform: scale(1.1); }

        .font-size-item {
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            color: #fff; transition: 0.1s; font-weight: 200;
        }
        .font-size-item:hover { background: var(--accent); color: #fff; }
        
        .fs-h1 { font-size: 1.3rem; font-weight: 300; }
        .fs-h2 { font-size: 1.1rem; font-weight: 300; }
        .fs-h3 { font-size: 0.95rem; font-weight: 300; }
        .fs-p { font-size: 0.875rem; }
        .fs-small { font-size: 0.75rem; }

        .custom-size-wrapper {
            display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 4px;
        }
        .custom-size-wrapper input {
            flex-grow: 1; background: rgba(255,255,255,0.1); border: none; border-radius: 6px;
            color: #fff; padding: 4px 8px; font-family: var(--base-font); outline: none; font-size: 0.8rem;
        }
        .custom-size-wrapper span { cursor: pointer; color: var(--accent); font-size: 0.8rem; font-weight: 300;}
        .custom-size-wrapper span:hover { text-decoration: underline; }

        /* 编辑器 */
        #editor {
            flex-grow: 1; background: transparent; border: none; outline: none;
            font-family: var(--base-font); font-size: 0.875rem; font-weight: 200; line-height: 1.9; letter-spacing: 0.5px;
            margin-top: 10px; color: #ffffff;
            overflow-y: auto; cursor: text; user-select: text; -webkit-user-select: text;
            word-break: break-word;
        }
        #editor:empty:before {
            content: attr(placeholder); color: var(--text-muted); opacity: 0.5; pointer-events: none; display: block;
        }
        #editor::-webkit-scrollbar { width: 4px; }
        #editor::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        #editor div, #editor p { margin: 0; padding: 0; }

        /* --- 底部操作栏 --- */
        .bottom-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; font-size: 0.85rem; font-weight: 200; color: var(--text-muted);
        }
        .save-btn {
            background: rgba(255, 75, 114, 0.1); border: 1px solid var(--accent);
            color: var(--accent); padding: 6px 18px; border-radius: 12px;
            cursor: pointer; font-family: var(--base-font); font-weight: 200; transition: 0.2s;
        }
        .save-btn:hover { background: var(--accent); color: #fff; }

        /* 时钟 */
        .clock-card {
            background: #000; color: #fff; justify-content: center; align-items: center; border: 1px solid #333;
        }
        #clock-time { font-size: 2.8rem; font-weight: 200; font-family: 'Nunito', monospace; letter-spacing: 2px; }
        #clock-date { font-size: 0.85rem; font-weight: 300; color: #888; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

        /* 文件列表 */
        .folder-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #fff; font-weight: 300;}
        .folder-header button {
            background: transparent; border: 1px dashed var(--accent); color: var(--accent);
            padding: 5px 10px; border-radius: 10px; cursor: pointer; font-family: var(--base-font); font-size: 0.8rem; font-weight: 200;
        }
        .folder-header button:hover { background: var(--accent); color: #fff; }

        .file-tree { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; font-weight: 200; }
        .file-tree::-webkit-scrollbar { width: 4px; }
        .file-tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .tree-node { margin-bottom: 6px; }
        .node-item {
            display: flex; align-items: center; padding: 8px 12px;
            border-radius: 12px; cursor: pointer; color: var(--folder-text); transition: 0.2s; font-weight: 200;
        }
        .node-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .node-item.active { background: rgba(255, 75, 114, 0.15); color: var(--accent); font-weight: 300; }
        .node-name { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .tri-icon {
            display: inline-block; width: 0; height: 0;
            border-top: 5px solid transparent; border-bottom: 5px solid transparent;
            border-left: 7px solid #ff4b72; margin-right: 12px; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 3px rgba(255, 75, 114, 0.6));
        }
        .tree-node.expanded > .node-item .tri-icon { transform: rotate(90deg); }

        .children-container {
            margin-left: 15px; border-left: 1px dashed rgba(255,255,255,0.1);
            padding-left: 10px; display: none;
        }
        .tree-node.expanded > .children-container { display: block; }

        .search-wrapper { margin-bottom: 15px; }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 10px 15px; color: #fff; font-family: var(--base-font); outline: none; font-size: 0.85rem; font-weight: 200;
        }
        .search-input:focus { border-color: var(--accent); }

        /* 右键菜单 */
        #context-menu {
            position: fixed; display: none; z-index: 1000;
            background: rgba(30, 15, 22, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 140px;
        }
        #context-menu div {
            padding: 8px 12px; font-size: 0.85rem; font-weight: 200; color: var(--text-main);
            border-radius: 8px; cursor: pointer; transition: 0.1s;
        }
        #context-menu div:hover { background: var(--accent); color: #fff; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="susu-letter">S</div>
        <div class="susu-letter">U</div>
        <div class="susu-letter">S</div>
        <div class="susu-letter">U</div>
    </div>

    <div id="main-app">
        <div class="glass-card editor-card">
            <div class="editor-header">
                <!-- 颜色 -->
                <div class="tool-group">
                    <button class="tool-btn" onclick="toggleMenu(event, 'palette')">🎨 颜色</button>
                    <div class="color-palette" id="palette">
                        <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
                        <div class="color-dot" style="background: #fdf5e6;" data-color="#fdf5e6"></div>
                        <div class="color-dot" style="background: #ffd1dc;" data-color="#ffd1dc"></div>
                        <div class="color-dot" style="background: #d8b4b8;" data-color="#d8b4b8"></div>
                        <div class="color-dot" style="background: #e6d7c3;" data-color="#e6d7c3"></div>
                        <div class="color-dot" style="background: #b2d8d8;" data-color="#b2d8d8"></div>
                        <div class="color-dot" style="background: #c1c8e4;" data-color="#c1c8e4"></div>
                        <div class="color-dot" style="background: #d4c4fb;" data-color="#d4c4fb"></div>
                        <div class="color-dot" style="background: #ffb7b2;" data-color="#ffb7b2"></div>
                        <div class="color-dot" style="background: #e8d5b5;" data-color="#e8d5b5"></div>
                    </div>
                </div>

                <!-- 字号 -->
                <div class="tool-group">
                    <button class="tool-btn" onclick="toggleMenu(event, 'font-menu')">T 字号</button>
                    <div class="dropdown-menu" id="font-menu">
                        <div class="font-size-item fs-h1" onclick="applyFontSize('1.3rem')">大标题</div>
                        <div class="font-size-item fs-h2" onclick="applyFontSize('1.1rem')">小标题</div>
                        <div class="font-size-item fs-h3" onclick="applyFontSize('0.95rem')">副标题</div>
                        <div class="font-size-item fs-p" onclick="applyFontSize('0.875rem')">正文</div>
                        <div class="font-size-item fs-small" onclick="applyFontSize('0.75rem')">小字</div>
                        <div class="custom-size-wrapper">
                            <input type="number" id="custom-size-input" placeholder="px" min="8" max="72">
                            <span onclick="applyCustomSize()">确定</span>
                        </div>
                    </div>
                </div>

                <!-- 新增：背景色调节 -->
                <div class="tool-group">
                    <button class="tool-btn" onclick="toggleMenu(event, 'bg-palette')">🌌 背景</button>
                    <div class="color-palette" id="bg-palette">
                        <!-- 通过 data-bg 存储渐变代码 -->
                        <div class="color-dot active" style="background: #1a0b12;" data-bg="radial-gradient(circle at 10% 10%, #4a1228 0%, #1a0b12 60%)" title="原版微醺"></div>
                        <div class="color-dot" style="background: #2d0a1a;" data-bg="radial-gradient(circle at 50% 10%, #6d1436 0%, #2d0a1a 70%)" title="丝绒红"></div>
                        <div class="color-dot" style="background: #1c132b;" data-bg="radial-gradient(circle at 80% 20%, #3b2158 0%, #1c132b 60%)" title="黑加仑紫"></div>
                        <div class="color-dot" style="background: #1a0a0a;" data-bg="radial-gradient(circle at 20% 80%, #4d1313 0%, #1a0a0a 60%)" title="暗夜红"></div>
                        <div class="color-dot" style="background: #2b0b16;" data-bg="radial-gradient(circle at 90% 50%, #7a0f29 0%, #2b0b16 70%)" title="勃艮第酒红"></div>
                        <div class="color-dot" style="background: #240b17;" data-bg="radial-gradient(circle at 30% 30%, #5e144b 0%, #240b17 60%)" title="紫罗兰"></div>
                        <div class="color-dot" style="background: #111;" data-bg="radial-gradient(circle at 50% 50%, #2a0e12 0%, #050505 80%)" title="极夜黑"></div>
                        <div class="color-dot" style="background: #2a1013;" data-bg="radial-gradient(circle at 10% 90%, #6e1f2b 0%, #2a1013 70%)" title="复古玫瑰"></div>
                        <div class="color-dot" style="background: #1c1a2b;" data-bg="radial-gradient(circle at 80% 80%, #42336b 0%, #1c1a2b 60%)" title="午夜幽蓝"></div>
                        <div class="color-dot" style="background: #1a1311;" data-bg="radial-gradient(circle at 50% 50%, #4a2c24 0%, #1a1311 60%)" title="暗夜摩卡"></div>
                    </div>
                </div>
            </div>

            <div id="editor" contenteditable="true" placeholder="开始你的沉浸式创作..."></div>
            
            <div class="bottom-bar">
                <button class="save-btn" onclick="manualSave()">💾 存档</button>
                <span>字数：<span id="word-count">0</span></span>
            </div>
        </div>

        <div class="glass-card clock-card">
            <div id="clock-time">00:00:00</div>
            <div id="clock-date">FRI, OCT 24</div>
        </div>

        <div class="glass-card folder-card">
            <div class="folder-header">
                <span>目录管理</span>
                <button onclick="createRootFolder()">+ 新建</button>
            </div>
            <div class="search-wrapper">
                <input type="text" class="search-input" placeholder="🔍 搜索内容..." oninput="searchNote(this.value)">
            </div>
            <div class="file-tree" id="file-tree"></div>
        </div>
    </div>

    <div id="context-menu"></div>

<script>
    // --- 0. 音频引擎 ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playIntroMelody() {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, index) => {
            setTimeout(() => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            }, index * 250);
        });
    }
    function playClickSound() {
        initAudio();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
    document.body.addEventListener('click', initAudio, { once: true });

    window.onload = () => {
        // 恢复上次保存的背景色
        const savedBg = localStorage.getItem('susu_bg_theme');
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-gradient', savedBg);
            document.querySelectorAll('#bg-palette .color-dot').forEach(d => {
                d.classList.remove('active');
                if(d.getAttribute('data-bg') === savedBg) d.classList.add('active');
            });
        }

        playIntroMelody();
        setTimeout(() => {
            document.getElementById('intro-screen').style.opacity = '0';
            document.getElementById('intro-screen').style.visibility = 'hidden';
            document.getElementById('main-app').style.opacity = '1';
        }, 2500);
    };

    // --- 1. 菜单开关管理 ---
    const editor = document.getElementById('editor');
    const palette = document.getElementById('palette');
    const bgPalette = document.getElementById('bg-palette');
    const fontMenu = document.getElementById('font-menu');

    window.toggleMenu = (e, menuId) => {
        e.stopPropagation();
        document.querySelectorAll('.dropdown-menu, .color-palette').forEach(el => el.classList.remove('show'));
        document.getElementById(menuId).classList.add('show');
    };
    document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown-menu, .color-palette').forEach(el => el.classList.remove('show'));
    });

    // --- 2. 各种颜色和字号操作 ---
    
    // 字体颜色
    document.querySelectorAll('#palette .color-dot').forEach(dot => {
        dot.onclick = (e) => {
            e.stopPropagation();
            const color = dot.getAttribute('data-color');
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('foreColor', false, color);
            
            document.querySelectorAll('#palette .color-dot').forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            palette.classList.remove('show');
            editor.focus();
        };
    });

    // 🎯 背景色切换
    document.querySelectorAll('#bg-palette .color-dot').forEach(dot => {
        dot.onclick = (e) => {
            e.stopPropagation();
            const bgGradient = dot.getAttribute('data-bg');
            // 改变全局 CSS 变量
            document.documentElement.style.setProperty('--bg-gradient', bgGradient);
            // 保存到本地
            localStorage.setItem('susu_bg_theme', bgGradient);
            
            document.querySelectorAll('#bg-palette .color-dot').forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            bgPalette.classList.remove('show');
        };
    });

    // 字号
    function applySizeToSelection(size) {
        const selection = window.getSelection();
        if (!selection.rangeCount || selection.isCollapsed) return;

        const range = selection.getRangeAt(0);
        const fragment = range.extractContents();
        
        const span = document.createElement('span');
        span.style.fontSize = size;
        span.style.fontWeight = (size === '1.3rem' || size === '1.1rem' || size === '0.95rem' || size === '20px' || size === '22px') ? '300' : '200';
        
        const innerFonts = fragment.querySelectorAll('font');
        innerFonts.forEach(f => f.removeAttribute('size'));

        span.appendChild(fragment);
        range.insertNode(span);
        
        selection.removeAllRanges();
        selection.addRange(range);
    }

    window.applyFontSize = (size) => {
        if (window.getSelection().toString()) {
            applySizeToSelection(size); 
        } else {
            const span = document.createElement('span');
            span.style.fontSize = size;
            span.style.fontWeight = '200';
            span.innerHTML = '&#8203;'; 
            insertNodeAtCursor(span);
        }
        fontMenu.classList.remove('show');
        editor.focus();
    };

    window.applyCustomSize = () => {
        const input = document.getElementById('custom-size-input');
        let size = input.value.trim();
        if (!size || isNaN(size)) return;
        size = size + 'px';
        
        if (window.getSelection().toString()) {
            applySizeToSelection(size); 
        } else {
            const span = document.createElement('span');
            span.style.fontSize = size;
            span.innerHTML = '&#8203;'; 
            insertNodeAtCursor(span);
        }
        input.value = '';
        fontMenu.classList.remove('show');
        editor.focus();
    };

    function insertNodeAtCursor(node) {
        const selection = window.getSelection();
        if (selection.rangeCount) {
            const range = selection.getRangeAt(0);
            range.deleteContents();
            range.insertNode(node);
            range.setStartAfter(node);
            range.setEndAfter(node);
            selection.removeAllRanges();
            selection.addRange(range);
        }
    }

    // 强制回车不断色
    editor.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.execCommand('insertParagraph', false, null);
            const selection = window.getSelection();
            if (selection.rangeCount) {
                const range = selection.getRangeAt(0);
                const parent = range.startContainer.parentElement;
                if (!parent.style.color && parent.tagName !== 'SPAN') {
                    const lastColor = localStorage.getItem('last_used_color') || '#ffffff';
                    document.execCommand('styleWithCSS', false, true);
                    document.execCommand('foreColor', false, lastColor);
                }
            }
        }
    });

    document.querySelectorAll('#palette .color-dot').forEach(dot => {
        dot.addEventListener('click', () => {
            localStorage.setItem('last_used_color', dot.getAttribute('data-color'));
        });
    });

    // --- 3. 右键菜单 ---
    const contextMenu = document.getElementById('context-menu');
    let rightClickNodeId = null;

    document.addEventListener('contextmenu', (e) => {
        if (e.target.closest('#editor')) {
            e.preventDefault();
            
            let hasHighlight = false;
            const selection = window.getSelection();
            
            if (selection.rangeCount > 0 && selection.toString().length > 0) {
                const range = selection.getRangeAt(0);
                let container = range.commonAncestorContainer;
                if (container.nodeType === 3) container = container.parentNode;
                
                let currentNode = container;
                while (currentNode && currentNode !== editor) {
                    if (currentNode.style && currentNode.style.backgroundColor) {
                        const bg = currentNode.style.backgroundColor;
                        if (bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)') {
                            hasHighlight = true;
                            break;
                        }
                    }
                    currentNode = currentNode.parentNode;
                }
            }

            let menuHTML = '';
            if (hasHighlight) {
                menuHTML = `<div onclick="removeHighlight()">🧹 取消高亮</div>`;
            } else {
                menuHTML = `
                    <div onclick="applyHighlight()">🖍️ 标记高亮</div>
                    <div onclick="applyBold()">加粗文字</div>
                `;
            }
            
            contextMenu.innerHTML = menuHTML;
            contextMenu.style.display = 'block';
            contextMenu.style.left = e.pageX + 'px';
            contextMenu.style.top = e.pageY + 'px';
        }
    });
    document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

    window.applyHighlight = () => {
        if (!window.getSelection().toString()) return;
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('hiliteColor', false, 'rgba(255, 75, 114, 0.3)'); 
        contextMenu.style.display = 'none';
    };

    window.removeHighlight = () => {
        if (!window.getSelection().toString()) return;
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('hiliteColor', false, 'transparent'); 
        contextMenu.style.display = 'none';
    };

    window.applyBold = () => {
        if (!window.getSelection().toString()) return;
        document.execCommand('bold', false, null);
        contextMenu.style.display = 'none';
    };

    // --- 4. 时钟 ---
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock-time').innerText = `${h}:${m}:${s}`;
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        document.getElementById('clock-date').innerText = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 5. 文件系统 ---
    let fileData = JSON.parse(localStorage.getItem('susu_tree_data')) || [
        { id: 'f1', name: '随笔灵感', type: 'folder', isOpen: true, children: [
            { id: 'n1', name: '深夜碎碎念.md', type: 'file' }
        ]},
        { id: 'f2', name: '读书笔记', type: 'folder', isOpen: false, children: [] }
    ];
    let activeFileId = 'n1';
    let saveTimer;
    const treeContainer = document.getElementById('file-tree');
    const wordCount = document.getElementById('word-count');

    function saveData() { localStorage.setItem('susu_tree_data', JSON.stringify(fileData)); }

    function showTreeContextMenu(e, node) {
        e.preventDefault(); e.stopPropagation();
        rightClickNodeId = node.id;
        
        let menuHTML = '';
        if (node.type === 'folder') {
            menuHTML = `
                <div onclick="ctxAction('createFile')">➕ 新建子文件</div>
                <div onclick="ctxAction('rename')">✏️ 新昵称</div>
                <div onclick="ctxAction('delete')">🗑️ 不要了</div>
            `;
        } else {
            menuHTML = `
                <div onclick="ctxAction('rename')">✏️ 新昵称</div>
                <div onclick="ctxAction('delete')">🗑️ 不要了</div>
            `;
        }
        
        contextMenu.innerHTML = menuHTML;
        contextMenu.style.display = 'block';
        contextMenu.style.left = e.pageX + 'px';
        contextMenu.style.top = e.pageY + 'px';
    }

    window.ctxAction = (action) => {
        if (!rightClickNodeId) return;
        if (action === 'rename') renameNode(rightClickNodeId);
        if (action === 'delete') deleteNode(rightClickNodeId);
        if (action === 'createFile') createFile(rightClickNodeId);
        contextMenu.style.display = 'none';
    };

    function renderTree(nodes, parentElement) {
        parentElement.innerHTML = '';
        
        nodes.forEach(node => {
            const nodeDiv = document.createElement('div');
            nodeDiv.className = `tree-node ${node.isOpen ? 'expanded' : ''}`;
            
            const itemDiv = document.createElement('div');
            itemDiv.className = `node-item ${activeFileId === node.id ? 'active' : ''}`;
            
            itemDiv.onclick = (e) => {
                e.stopPropagation();
                if (node.type === 'folder') {
                    playClickSound();
                    node.isOpen = !node.isOpen;
                    saveData(); renderTree(fileData, treeContainer);
                } else {
                    activeFileId = node.id;
                    loadContent(); renderTree(fileData, treeContainer);
                }
            };

            itemDiv.oncontextmenu = (e) => showTreeContextMenu(e, node);

            let iconHTML = node.type === 'folder' ? `<span class="tri-icon"></span>` : `<span style="margin-right:12px; opacity:0.7;">📄</span>`;
            itemDiv.innerHTML = `${iconHTML}<span class="node-name">${node.name}</span>`;

            nodeDiv.appendChild(itemDiv);

            if (node.type === 'folder') {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'children-container';
                nodeDiv.appendChild(childrenContainer);
                
                renderTree(node.children, childrenContainer);
            }
            parentElement.appendChild(nodeDiv);
        });
    }

    window.createRootFolder = () => {
        const name = prompt("请输入文件夹名称：", "新分类");
        if (name) {
            fileData.push({ id: 'f_' + Date.now(), name: name, type: 'folder', isOpen: true, children: [] });
            saveData(); renderTree(fileData, treeContainer);
        }
    }

    function createFile(parentId) {
        const name = prompt("请输入文件名：", "新建笔记.md");
        if (name) {
            const findFolder = (nodes) => {
                for (let n of nodes) {
                    if (n.id === parentId) return n;
                    if (n.children) { const f = findFolder(n.children); if (f) return f; }
                }
                return null;
            };
            const folder = findFolder(fileData);
            if (folder) {
                folder.children.push({ id: 'n_' + Date.now(), name: name, type: 'file' });
                folder.isOpen = true; 
                saveData(); renderTree(fileData, treeContainer);
            }
        }
    }

    function renameNode(id) {
        const newNodeName = prompt("修改名称：");
        if (!newNodeName) return;
        const findAndRename = (nodes) => {
            for (let n of nodes) {
                if (n.id === id) { n.name = newNodeName; return true; }
                if (n.children && findAndRename(n.children)) return true;
            }
            return false;
        };
        if (findAndRename(fileData)) { saveData(); renderTree(fileData, treeContainer); }
    }

    function deleteNode(id) {
        if (!confirm("确定要删除吗？")) return;
        const removeNode = (nodes) => {
            for (let i = 0; i < nodes.length; i++) {
                if (nodes[i].id === id) { nodes.splice(i, 1); return true; }
                if (nodes[i].children && removeNode(nodes[i].children)) return true;
            }
            return false;
        };
        if (removeNode(fileData)) { 
            if(activeFileId === id) { editor.innerHTML = ''; activeFileId = null; }
            saveData(); renderTree(fileData, treeContainer); 
        }
    }

    // --- 6. 内容存取 ---
    function loadContent() {
        if(!activeFileId) return;
        editor.innerHTML = localStorage.getItem('susu_html_' + activeFileId) || '';
        updateCount();
    }

    editor.addEventListener('input', () => {
        if(!activeFileId) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            localStorage.setItem('susu_html_' + activeFileId, editor.innerHTML);
            updateCount();
        }, 400);
    });

    window.manualSave = () => {
        if(!activeFileId) return alert("请先选择一个文件！");
        localStorage.setItem('susu_html_' + activeFileId, editor.innerHTML);
        updateCount();
        
        const btn = document.querySelector('.save-btn');
        const oldText = btn.innerText;
        btn.innerText = 'OK啦！'; 
        btn.style.background = 'var(--accent)'; 
        btn.style.color = '#fff';
        setTimeout(() => {
            btn.innerText = oldText; 
            btn.style.background = 'rgba(255, 75, 114, 0.1)'; 
            btn.style.color = 'var(--accent)';
        }, 1500);
    }

    function updateCount() {
        const text = editor.innerText.replace(/\s/g, '');
        wordCount.innerText = text.length;
    }

    window.searchNote = (keyword) => {
        if(!keyword) return;
        const text = editor.innerText;
        if(text.includes(keyword)) {
            alert('在本文中找到了：' + keyword);
        }
    }

    renderTree(fileData, treeContainer);
    loadContent();
    editor.focus();
</script>
</body>
</html>
